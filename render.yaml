# Render Blueprint — Infrastructure as Code
# Docs: https://render.com/docs/blueprint-spec
#
# This deploys the NestJS backend server.
# The frontend is deployed on Vercel separately.

services:
  - type: web
    name: novelcraft-pro-server
    runtime: node
    region: singapore           # 新加坡，对国内访问延迟较低
    plan: free
    buildCommand: cd server && npm install && npx nest build && npx prisma generate
    startCommand: cd server && node dist/main
    envVars:
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false              # ⚠️ 务必在 Render 仪表板设置此值
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false              # ⚠️ 设置为 Vercel 前端域名，如 https://xxx.vercel.app
